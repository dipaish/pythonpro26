name: Build MkDocs to site (Dracula)

on:
  push:
    branches:
      - mkdocsTesting
    # Avoid rebuild loops by ignoring changes that only touch the generated site/
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MkDocs and Dracula theme
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          python - << 'PY'
          import mkdocs, mkdocs_dracula_theme
          print('MkDocs', mkdocs.__version__)
          print('Dracula theme OK:', mkdocs_dracula_theme.__name__)
          PY
      - name: Build site (strict)
        run: mkdocs build --strict
      - name: Commit and push updated site/
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "No changes in site/ to commit"
          else
            git commit -m "Docs: rebuild site [skip ci]"
            git push
          fi
